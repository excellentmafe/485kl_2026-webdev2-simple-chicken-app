<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto p-6 bg-white shadow-lg rounded-lg w-full max-w-lg" x-data="chickenManager()">
        <h1 class="text-2xl font-bold text-center mb-4">Chicken Manager</h1>
        
        <div class="mb-4 flex space-x-2">
            <input type="text" x-model="newChicken.name" placeholder="NAME" class="border p-2 rounded w-full">
            <input type="number" x-model="newChicken.age" placeholder="AGE" class="border p-2 rounded w-24">
            <input type="number" step="0.1" x-model="newChicken.weight" placeholder="WEIGHT" class="border p-2 rounded w-24">
            <button @click="addChicken" class="bg-blue-500 text-white px-4 py-2 rounded">Add</button>
        </div>
        
        <div class="space-y-2">
            <template x-for="chicken in chickens" :key="chicken.id">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded shadow">
                    <div class="flex items-center space-x-2">
                        <img src="/chicken.webp" alt="Chicken Icon" class="w-6 h-6">
                        <span class="font-bold" x-text="chicken.name"></span>
                        <span class="text-gray-600"> - <span x-text="chicken.age"></span> years</span>
                        <span class="text-gray-600"> - <span x-text="chicken.weight"></span> kg</span>
                    </div>
                    <button @click="deleteChicken(chicken.id)" class="bg-red-500 text-white px-3 py-1 rounded">Delete</button>
                </div>
            </template>
        </div>
    </div>

    <script>
        function chickenManager() {
            return {
                chickens: [],
                newChicken: { name: '', age: '', weight: '' },
                
                async fetchChickens() {
                    const response = await fetch('/api/chickens');
                    this.chickens = await response.json();
                    console.log("Fetched chickens:", this.chickens);
                },
                
                async addChicken() {
                    await fetch('/api/chickens', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.newChicken)
                    });
                    this.newChicken = { name: '', age: '', weight: '' };
                    this.fetchChickens();
                },
                
                async deleteChicken(id) {
                    await fetch(`/api/chickens/${id}`, { method: 'DELETE' });
                    this.fetchChickens();
                },
                
                init() {
                    this.fetchChickens();
                }
            };
        }
    </script>
</body>
</html>
